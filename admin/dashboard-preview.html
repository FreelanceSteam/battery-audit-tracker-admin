```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Battery Audit Tracker | Admin Dashboard Preview</title>
<style>
:root {
  --navy: #06469f;
  --blue: #0875e8;
  --yellow: #ffca05;
  --bg: #eaf3ff;
  --text: #102b52;
  --border: #c8dfff;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  color: var(--text);
  background: linear-gradient(#d8eaff, #f4f8ff);
}
.header {
  background: linear-gradient(110deg, #073c86, #0875e8);
  color: white;
  padding: 25px 20px;
  text-align: center;
  border-bottom: 5px solid var(--yellow);
}
.header .battery { font-size: 42px; }
.header h1 { margin: 8px 0; font-size: clamp(23px, 4vw, 34px); }
.header p { margin: 5px 0 0; }
.notice {
  margin: 16px 20px;
  padding: 13px 16px;
  border: 1px solid var(--border);
  background: #edf6ff;
  border-radius: 12px;
  color: #0752a5;
}
nav {
  margin: 16px 20px;
  padding: 10px;
  background: #06469f;
  border-radius: 20px;
  display: flex;
  flex-wrap: wrap;
  gap: 9px;
  box-shadow: 0 8px 20px #123b7525;
}
nav button {
  flex: 1 1 145px;
  border: 1px solid #75b7ff;
  border-radius: 30px;
  padding: 15px 10px;
  background: linear-gradient(#1688f8, #0759c2);
  color: white;
  font-size: 14px;
  font-weight: bold;
  cursor: pointer;
}
nav button.active {
  background: linear-gradient(#ffe34c, #ffbd00);
  color: #063776;
  border: 2px solid white;
}
main { padding: 0 20px 25px; }
.section {
  background: white;
  border: 1px solid var(--border);
  border-radius: 22px;
  padding: 22px;
  box-shadow: 0 8px 24px #174b8015;
}
.section h2 { margin-top: 0; }
.kpis {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(145px, 1fr));
  gap: 12px;
  margin-bottom: 18px;
}
.kpi {
  padding: 19px;
  color: white;
  border-radius: 16px;
  min-height: 95px;
  box-shadow: 0 5px 0 #123b7520;
}
.kpi small { display: block; font-weight: bold; margin-bottom: 9px; }
.kpi strong { font-size: 27px; }
.k1 { background: #2879e5; }
.k2 { background: #12b981; }
.k3 { background: #ff9d35; }
.k4 { background: #9751e8; }
.k5 { background: #16a9c8; }
.k6 { background: #e84979; }
.toolbar {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin: 14px 0;
}
input, select {
  padding: 13px;
  border: 1px solid var(--border);
  border-radius: 10px;
  font-size: 14px;
  background: white;
  min-width: 160px;
}
.toolbar input { flex: 1; }
.action {
  padding: 12px 17px;
  border: 0;
  border-radius: 10px;
  background: var(--blue);
  color: white;
  font-weight: bold;
  cursor: pointer;
}
.table-wrap {
  overflow-x: auto;
  border: 1px solid var(--border);
  border-radius: 12px;
}
table { width: 100%; border-collapse: collapse; min-width: 650px; }
th {
  padding: 14px 12px;
  background: #075bc4;
  color: white;
  text-align: left;
  white-space: nowrap;
}
td { padding: 13px 12px; border-bottom: 1px solid #dceaff; }
tbody tr:nth-child(even) { background: #edf5ff; }
.badge {
  display: inline-block;
  background: #e3f7e9;
  color: #087a38;
  border-radius: 20px;
  padding: 5px 10px;
  font-weight: bold;
}
.muted { color: #637b9c; line-height: 1.6; }
footer { text-align: center; padding: 18px; color: #637b9c; }
@media(max-width:600px) {
  .notice, nav { margin: 12px; }
  main { padding: 0 12px 18px; }
  .section { padding: 15px; }
  nav button { flex-basis: 42%; }
}
</style>
</head>
<body>
<header class="header">
  <div class="battery">🔋</div>
  <h1>BATTERY AUDIT TRACKER</h1>
  <p>Admin Control Center — Dashboard Preview</p>
</
