<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0754c8">
  <meta name="description" content="Battery Audit Tracker Admin launcher">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icons/battery-admin-192.png" type="image/png">
  <link rel="apple-touch-icon" href="./icons/battery-admin-192.png">
  <title>Battery Audit Tracker Admin</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: clamp(8px, 2vw, 22px);
      background: radial-gradient(ellipse at 50% 35%, #1977f5 0%, #0754c8 48%, #063582 100%);
      color: white;
      font-family: Arial, Helvetica, sans-serif;
      overflow-x: hidden;
    }
    .launcher {
      width: min(100%, 620px);
      position: relative;
      z-index: 1;
      margin: 0 auto;
      text-align: center;
    }
    .launcher-banner {
      position: relative;
      width: 100%;
      margin: 0 auto;
      line-height: 0;
      overflow: hidden;
      border-radius: clamp(14px, 3vw, 24px);
      box-shadow: 0 12px 35px rgba(0, 0, 0, .28);
    }
    .launcher-banner img {
      display: block;
      width: 100%;
      height: auto;
      object-fit: contain;
    }
    .banner-admin-link, .banner-install-link {
      position: absolute;
      display: block;
      z-index: 2;
      background: transparent;
      cursor: pointer;
      border-radius: 12px;
    }
    /* Percentages correspond to the approved full-height banner artwork. */
    .banner-admin-link { left: 9.5%; top: 62.3%; width: 81%; height: 5.8%; }
    .banner-install-link { left: 12%; top: 68.7%; width: 76%; height: 5%; }
    .banner-admin-link:focus-visible, .banner-install-link:focus-visible {
      outline: 3px solid white;
      outline-offset: -3px;
    }
    .status {
      font-size: 13px;
      line-height: 1.5;
      color: #fff2b8;
      text-align: center;
    }
    .status:not(:empty) { margin: 12px 8px 0; }
    @media (max-width: 420px) {
      body { padding: 6px; }
      .launcher { width: 100%; }
      .launcher-banner { border-radius: 16px; }
    }
  </style>
</head>
<body>
  <main class="launcher" aria-label="Battery Audit Tracker Admin launcher">
    <div class="launcher-banner">
      <img src="./icons/battery-admin-banner.png?v=2" alt="Battery Audit Tracker Admin — Designed by Nagendra Yadav">
      <a class="banner-admin-link" id="openAdmin" href="https://script.google.com/macros/s/AKfycbzZjSM5-ZV8zsJiJaHnlZ-pv9L1BcUt0479nMMUNY35L6BeHXgtYsTUQ-HU6Uqxt3Vzvw/exec?admin=1" aria-label="Open Admin App" title="Open Admin App"></a>
      <a class="banner-install-link" id="bannerInstallLink" href="#" aria-label="Install Battery Audit Tracker" title="Install Battery Audit Tracker"></a>
    </div>
    <div class="status" id="status" role="status" aria-live="polite"></div>
  </main>
  <script>
    const ADMIN_APP_URL = "https://script.google.com/macros/s/AKfycbzZjSM5-ZV8zsJiJaHnlZ-pv9L1BcUt0479nMMUNY35L6BeHXgtYsTUQ-HU6Uqxt3Vzvw/exec?admin=1";
    const openAdmin = document.getElementById("openAdmin");
    const installLink = document.getElementById("bannerInstallLink");
    const statusEl = document.getElementById("status");
    let installPrompt = null;
    openAdmin.href = ADMIN_APP_URL;

    function isInstalledMode() {
      return window.matchMedia("(display-mode: standalone)").matches ||
             window.matchMedia("(display-mode: fullscreen)").matches ||
             window.navigator.standalone === true;
    }
    window.addEventListener("beforeinstallprompt", event => {
      event.preventDefault();
      installPrompt = event;
    });
    installLink.addEventListener("click", async event => {
      event.preventDefault();
      if (isInstalledMode()) {
        statusEl.textContent = "Battery Audit is already running as an installed app.";
        return;
      }
      if (installPrompt) {
        const promptEvent = installPrompt;
        installPrompt = null;
        await promptEvent.prompt();
        await promptEvent.userChoice;
        return;
      }
      if (/iphone|ipad|ipod/i.test(navigator.userAgent)) {
        statusEl.textContent = "Safari: tap Share, then choose Add to Home Screen.";
      } else {
        statusEl.textContent = "Open your browser menu and choose Install app or Add to Home screen (if available).";
      }
    });
    window.addEventListener("appinstalled", () => {
      installPrompt = null;
      statusEl.textContent = "Battery Audit installed successfully.";
    });
    if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./service-worker.js")
          .catch(error => console.warn("Service worker registration failed", error));
      });
    }
  </script>
</body>
</html>
