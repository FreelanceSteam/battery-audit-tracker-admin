<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#123b73"><meta name="description" content="Battery Audit Tracker Admin Control Center">
<title>Battery Audit Tracker — Admin</title>
<style>
:root{--navy:#123b73;--blue:#1769aa;--pale:#eaf2fb;--ink:#172b4d;--muted:#66758a;--line:#dce5ef}*{box-sizing:border-box}body{margin:0;background:#f3f6fa;color:var(--ink);font-family:Arial,Helvetica,sans-serif}.top{background:linear-gradient(120deg,var(--navy),var(--blue));color:white;padding:18px clamp(14px,3vw,34px);display:flex;align-items:center;justify-content:space-between;gap:12px;box-shadow:0 4px 16px #123b7322}.brand{display:flex;align-items:center;gap:13px}.logo{display:grid;place-items:center;width:44px;height:44px;border-radius:12px;background:#ffffff20;font-size:24px}.brand h1{font-size:clamp(18px,2.3vw,26px);margin:0}.brand p{margin:5px 0 0;color:#dbeafe;font-size:13px}.pill{border:1px solid #ffffff55;background:#ffffff18;padding:8px 12px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}.wrap{max-width:1600px;margin:auto;padding:16px clamp(10px,2vw,24px)}.notice{background:#fff;border:1px solid var(--line);border-left:4px solid #f59e0b;border-radius:12px;padding:12px 14px;margin-bottom:12px;color:#45566d;font-size:13px;line-height:1.5}.framebox{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 6px 24px #123b730c}.framehead{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 15px;border-bottom:1px solid var(--line);font-weight:700}.framehead a{color:var(--blue);text-decoration:none;font-size:13px}.appframe{display:block;width:100%;height:calc(100dvh - 190px);min-height:650px;border:0;background:white}.setup{padding:18px}.setup label{display:block;font-size:13px;font-weight:700;margin-bottom:8px}.setup input{width:100%;padding:12px;border:1px solid #bccbdd;border-radius:8px;font-size:14px}.setup button{margin-top:10px;border:0;border-radius:8px;background:var(--blue);color:white;padding:11px 16px;font-weight:700;cursor:pointer}.hidden{display:none!important}@media(max-width:640px){.top{align-items:flex-start}.pill{font-size:10px;padding:7px 9px}.logo{width:38px;height:38px}.appframe{height:calc(100dvh - 220px);min-height:600px}.wrap{padding:10px}.framehead{padding:11px;font-size:14px}.framehead a{font-size:12px}}
</style><link rel="manifest" href="./manifest.json"><link rel="icon" href="../assets/battery-admin-logo.svg" type="image/svg+xml"></head>
<body>
<header class="top"><div class="brand"><div class="logo">🔋</div><div><h1>Battery Audit Tracker</h1><p>Admin Control Center</p></div></div><div class="pill">ADMIN PANEL</div></header>
<main class="wrap"><div id="setupNotice" class="notice">Connect this GitHub page to your existing Battery Apps Script deployment once. This wrapper does not store audit records; Google Sheets remains the data source.</div>
<section id="configBox" class="framebox setup"><label for="scriptUrl">Google Apps Script Web App URL (ending in /exec)</label><input id="scriptUrl" type="url" placeholder="https://script.google.com/macros/s/.../exec" autocomplete="url"><button id="connectBtn" type="button">Connect Admin App</button></section>
<section id="appBox" class="framebox hidden"><div class="framehead"><span>Battery Audit Admin</span><a id="openDirect" target="_blank" rel="noopener">Open directly ↗</a></div><iframe id="appFrame" class="appframe" title="Battery Audit Admin Panel" allow="clipboard-read; clipboard-write"></iframe></section></main>
<script src="./config.js"></script><script>
const key='batteryAppsScriptUrl';const input=document.getElementById('scriptUrl');const box=document.getElementById('configBox');const appBox=document.getElementById('appBox');const notice=document.getElementById('setupNotice');
function valid(u){try{const x=new URL(u);return x.protocol==='https:'&&/script\.google\.com$/.test(x.hostname)&&x.pathname.includes('/macros/s/')&&x.pathname.endsWith('/exec')}catch(e){return false}}
function connect(u){if(!valid(u)){alert('Please enter a valid Google Apps Script Web App URL ending in /exec.');return}const target=u+(u.includes('?')?'&':'?')+'admin=1';document.getElementById('appFrame').src=target;document.getElementById('openDirect').href=target;appBox.classList.remove('hidden');box.classList.add('hidden');notice.classList.add('hidden')}
document.getElementById('connectBtn').addEventListener('click',()=>connect(input.value.trim()));const initial=window.BATTERY_APPS_SCRIPT_URL||'';if(valid(initial)){input.value=initial;connect(initial)}else{const saved=window.localStorage.getItem(key);if(saved&&valid(saved)){input.value=saved;connect(saved)}}
</script></body></html>
