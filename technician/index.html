<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#03143d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Battery Audit">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="manifest" id="appManifest" href="./manifest.webmanifest">
<title>Battery Audit Tracker</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;min-height:100%;overflow:hidden;background:#03143d;font-family:Arial,Helvetica,sans-serif}
#appFrame{position:fixed;inset:0;width:100%;height:100%;height:100dvh;border:0;background:#eaf3ff;display:block}
#loading{position:fixed;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;padding:24px;text-align:center;color:#fff;background:radial-gradient(ellipse at 50% -10%,#0b4f9d 0,#061e54 42%,#020b27 100%)}
#loading img{width:112px;height:112px;object-fit:cover;border-radius:24px;border:2px solid #9ceeff;box-shadow:0 0 25px #00bfff88}
#loading strong{font-size:22px;color:#ffd52e}
#loading span{font-size:14px;line-height:1.5;color:#e4efff}
#fallback{display:none;margin-top:8px;padding:13px 20px;border-radius:14px;background:#0871e7;color:white;text-decoration:none;font-weight:800}
</style>
</head>
<body>
<div id="loading">
  <img src="./icon-512.png" alt="Battery Audit">
  <strong>BATTERY AUDIT</strong>
  <span id="loadText">Opening your secure Technician Dashboard…</span>
  <a id="fallback" href="#" target="_blank" rel="noopener">OPEN DASHBOARD IN BROWSER</a>
</div>
<iframe id="appFrame" title="Battery Audit Technician Dashboard" allow="clipboard-read; clipboard-write; geolocation" referrerpolicy="no-referrer" allowfullscreen></iframe>
<script>
(function(){
  "use strict";
  const APP_URL = "https://script.google.com/macros/s/AKfycbzZjSM5-ZV8zsJiJaHnlZ-pv9L1BcUt0479nMMUNY35L6BeHXgtYsTUQ-HU6Uqxt3Vzvw/exec";
  const KEY = "batteryAuditTechnicianToken";
  const params = new URLSearchParams(window.location.search);
  let token = (params.get("token") || "").trim();
  if (token) { try { localStorage.setItem(KEY, token); } catch(e) {} }
  else { try { token = (localStorage.getItem(KEY) || "").trim(); } catch(e) {} }

  if (!token) {
    document.getElementById("loadText").textContent =
      "Technician token missing. Open your personal link shared by your admin, then add that page to Home Screen.";
    document.getElementById("appFrame").style.display = "none";
    return;
  }

  const target = APP_URL + "?token=" + encodeURIComponent(token);
  document.getElementById("fallback").href = target;

  try {
    const manifest = {
      name:"Battery Audit Tracker", short_name:"Battery Audit",
      start_url:"./?token=" + encodeURIComponent(token), scope:"./",
      display:"standalone", orientation:"portrait",
      background_color:"#03143d", theme_color:"#03143d",
      icons:[
        {src:"./icon-192.png",sizes:"192x192",type:"image/png"},
        {src:"./icon-512.png",sizes:"512x512",type:"image/png"}
      ]
    };
    const blob = new Blob([JSON.stringify(manifest)], {type:"application/manifest+json"});
    document.getElementById("appManifest").href = URL.createObjectURL(blob);
  } catch(e) {}

  const frame = document.getElementById("appFrame");
  let loaded = false;
  frame.addEventListener("load", function(){
    loaded = true;
    document.getElementById("loading").style.display = "none";
  });
  frame.src = target;

  window.setTimeout(function(){
    if (!loaded) {
      document.getElementById("loadText").textContent =
        "Dashboard is taking longer than expected. If it does not appear, open it directly.";
      document.getElementById("fallback").style.display = "inline-block";
    }
  }, 12000);
})();
</script>
</body>
</html>
