<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#123b73"><meta name="description" content="Battery Audit Technician App"><title>Battery Audit Technician App</title>
<style>:root{--navy:#123b73;--blue:#1769aa;--pale:#eaf2fb;--ink:#172b4d;--muted:#66758a;--line:#dce5ef}*{box-sizing:border-box}body{margin:0;background:#f3f6fa;color:var(--ink);font-family:Arial,Helvetica,sans-serif}.top{background:linear-gradient(120deg,var(--navy),var(--blue));color:white;padding:16px clamp(12px,3vw,28px);display:flex;align-items:center;gap:12px}.logo{display:grid;place-items:center;width:42px;height:42px;border-radius:12px;background:#ffffff20;font-size:23px}.top h1{font-size:clamp(18px,2.5vw,24px);margin:0}.top p{margin:4px 0 0;color:#dbeafe;font-size:13px}.wrap{max-width:1000px;margin:auto;padding:14px clamp(8px,2vw,20px)}.notice{background:white;border:1px solid var(--line);border-left:4px solid #f59e0b;border-radius:12px;padding:12px 14px;margin-bottom:12px;color:#45566d;font-size:13px;line-height:1.5}.setup{background:white;border:1px solid var(--line);border-radius:12px;padding:16px}.setup label{display:block;font-size:13px;font-weight:700;margin-bottom:8px}.setup input{width:100%;padding:12px;border:1px solid #bccbdd;border-radius:8px;font-size:14px}.setup button{margin-top:10px;border:0;border-radius:8px;background:var(--blue);color:white;padding:11px 16px;font-weight:700;cursor:pointer}.framebox{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:white;box-shadow:0 6px 24px #123b730c}.framehead{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:11px 14px;border-bottom:1px solid var(--line);font-weight:700}.framehead a{font-size:12px;color:var(--blue);text-decoration:none}.appframe{display:block;width:100%;height:calc(100dvh - 180px);min-height:680px;border:0;background:white}.hidden{display:none!important}@media(max-width:600px){.top{padding:13px 12px}.logo{width:36px;height:36px}.wrap{padding:9px 7px}.appframe{height:calc(100dvh - 175px);min-height:650px}.framehead{padding:10px;font-size:13px}}
</style><link rel="manifest" href="./manifest.json"><link rel="icon" href="../assets/battery-technician-logo.svg" type="image/svg+xml"></head><body><header class="top"><div class="logo">🔋</div><div><h1>Battery Audit</h1><p>Technician Portal</p></div></header><main class="wrap"><div id="notice" class="notice">Enter your assigned technician link token if it is not already included in this URL. Audit access is validated by the existing Apps Script backend.</div><section id="setup" class="setup"><label for="scriptUrl">Google Apps Script Web App URL (ending in /exec)</label><input id="scriptUrl" type="url" placeholder="https://script.google.com/macros/s/.../exec"><label for="token" style="margin-top:12px">Technician token</label><input id="token" type="text" placeholder="Token from your technician link" autocomplete="off"><button id="connect" type="button">Open Technician App</button></section><section id="appBox" class="framebox hidden" style="margin-top:12px"><div class="framehead"><span>Battery Audit Form</span><a id="direct" target="_blank" rel="noopener">Open directly ↗</a></div><iframe id="frame" class="appframe" title="Battery Audit Technician App" allow="clipboard-read; clipboard-write"></iframe></section></main><script src="./config.js"></script><script>
const qs=new URLSearchParams(location.search);const tokenInput=document.getElementById('token');const urlInput=document.getElementById('scriptUrl');const savedUrl=window.localStorage.getItem('batteryAppsScriptUrl');const configured=window.BATTERY_APPS_SCRIPT_URL||'';if(configured.includes('script.google.com'))urlInput.value=configured;else if(savedUrl)urlInput.value=savedUrl;tokenInput.value=qs.get('token')||'';
function valid(u){try{const x=new URL(u);return x.protocol==='https:'&&x.hostname==='script.google.com'&&x.pathname.includes('/macros/s/')&&x.pathname.endsWith('/exec')}catch(e){return false}}
function connect(){const u=urlInput.value.trim();const t=tokenInput.value.trim();if(!valid(u)){alert('Please enter a valid Apps Script Web App URL ending in /exec.');return}if(!t){alert('Please enter your technician token.');return}window.localStorage.setItem('batteryAppsScriptUrl',u);const target=u+(u.includes('?')?'&':'?')+'token='+encodeURIComponent(t);document.getElementById('frame').src=target;document.getElementById('direct').href=target;document.getElementById('appBox').classList.remove('hidden');document.getElementById('setup').classList.add('hidden');document.getElementById('notice').classList.add('hidden')}
document.getElementById('connect').addEventListener('click',connect);
</script></body></html>
